services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goblins
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: goblins
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblins -d goblins"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    profiles: ["app"]
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: postgres://goblins:local-development-only@postgres:5432/goblins
      PGMQ_INSTALL_MODE: sql
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    profiles: ["app"]
    build: { context: ., target: runtime }
    environment:
      DATABASE_URL: postgres://goblins:local-development-only@postgres:5432/goblins
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      STORAGE_PROVIDER: local
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["images:/app/.data/images"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    profiles: ["app"]
    build: { context: ., target: runtime }
    environment:
      DATABASE_URL: postgres://goblins:local-development-only@postgres:5432/goblins
      APP_MODE: load-test
      OCR_PROVIDER: mock
      GRADING_PROVIDER: mock
      STORAGE_PROVIDER: local
      PORT: "8081"
    command: ["npm", "run", "worker:prod"]
    volumes: ["images:/app/.data/images"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  postgres-data:
  images:
